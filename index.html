<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#d96b3a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Extrusión de moldes · CEVIL</title>
  <link rel="icon" href="img/logo-cmp.png">
  <link rel="apple-touch-icon" href="img/logo-cmp.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('mt_tema') || 'null');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.8.3/build/index.module.js","three-bvh-csg":"https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.17/build/index.module.js"}}</script>
  <script src="config.js" defer></script>
  <script src="geo.js" defer></script>
  <script src="revision.js" defer></script>
  <script src="plano.js" defer></script>
  <script src="datos.js" defer></script>
  <script src="app.js" defer></script>
  <script src="piezas.js" defer></script>
  <script src="subir.js" defer></script>
  <script type="module" src="visor.js"></script>
  <script type="module" src="pieza3d.js"></script>
</head>
<body>
  <div id="splash">
    <span class="logo-tile"><img src="img/logo-cmp.png" alt=""></span>
    <div class="orbita" aria-hidden="true"><span>🧱</span><span>📐</span><span>🔥</span><span>⚖️</span></div>
    <h2>Matrices</h2>
    <p id="splashTxt">Midiendo dados…</p>
    <div class="barra"><span></span></div>
  </div>
  <div id="toploader"><span></span></div>

  <header class="top">
    <a class="brand" href="#/catalogo">
      <span class="logo-tile"><img src="img/logo-cmp.png" alt=""></span>
      <div>Extrusión<small>Moldes · Piezas en 3D</small></div>
    </a>
    <nav class="nav" id="nav" aria-label="Secciones"></nav>
    <div class="top-right">
      <a class="tag t-warn" id="chipAdmin" href="#/ajustes" hidden>🔐 Admin</a>
      <span class="estado-red" id="red"><i></i><span>Conectando</span></span>
      <button class="btn ghost icon" id="btnRefrescar" title="Actualizar datos" aria-label="Actualizar datos">🔄</button>
      <button class="btn ghost icon" id="btnTema" title="Cambiar tema claro u oscuro" aria-label="Cambiar tema">🌙</button>
    </div>
  </header>

  <main id="app"></main>
  <nav class="bottom-nav" id="bnav" aria-label="Secciones"></nav>
  <div id="toasts" aria-live="polite"></div>

  <dialog id="dlg">
    <form method="dialog">
      <div class="dlg-ico">🗑️</div>
      <p id="dlgTexto"></p>
      <div class="acciones">
        <button class="btn" value="no">Cancelar</button>
        <button class="btn pri dan-pri" value="si">Confirmar</button>
      </div>
    </form>
  </dialog>
  <dialog id="dlgEd" class="dlg-ancho"></dialog>
</body>
</html>
